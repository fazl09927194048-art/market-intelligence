name: Package DRO browser extension
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package DRO extension
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/dro-extension.zip . -x '*.DS_Store'
      - name: Upload DRO extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: dro-extension
          path: dist/dro-extension.zip
