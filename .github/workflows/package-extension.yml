name: Package browser extension
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/market-intel-extension.zip . -x '*.DS_Store'
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-intel-extension
          path: dist/market-intel-extension.zip
