name: Build xXx DRO Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          find android/app/src/main -maxdepth 6 -type f | sort

      - name: Build debug APK and AAB
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug bundleDebug

      - name: Prepare stable Android artifacts
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/debug/app-debug.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/xXx-DRO.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab android/app/build/outputs/bundle/debug/xXx-DRO.aab
          ls -lh android/app/build/outputs/apk/debug/xXx-DRO.apk android/app/build/outputs/bundle/debug/xXx-DRO.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xXx-DRO-Android
          path: |
            android/app/build/outputs/apk/debug/xXx-DRO.apk
            android/app/build/outputs/bundle/debug/xXx-DRO.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xXx-DRO-latest
          name: xXx DRO Latest
          body: |
            Latest xXx DRO Android debug artifacts.
            Package: com.xxx.superapp
            Target Android: 15 (API 35)
            APK: debug build for direct testing.
            AAB: debug bundle for integration/testing; Play Store production publishing still requires a signing key and release configuration.
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/xXx-DRO.apk
            android/app/build/outputs/bundle/debug/xXx-DRO.aab
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
