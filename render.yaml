services:
  - type: web
    name: market-intelligence
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DRO_KEY_ENCRYPTION_SECRET
        generateValue: true
