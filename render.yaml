services:
  - type: web
    name: market-intelligence
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: market-intelligence-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        value: FLI Security <onboarding@resend.dev>
